<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- Student Form -->

        <div class="form-box">

            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <label>Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

                <label>Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    required
                >

                <label>Course</label>
                <input
                    type="text"
                    id="course"
                    placeholder="Enter course"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                    style="display:none;"
                >
                    Cancel
                </button>

            </form>

        </div>


        <!-- Student List -->

        <div class="table-box">

            <h2>Student List</h2>

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="studentTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
